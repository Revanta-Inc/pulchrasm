name: Build test and publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.9
  PULCHRA_TEST_FIXTURES: ${{ github.workspace }}/.test-data/cgback-paper/02-tables/models/scn-test/pulchra

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check out SCN test fixtures
        uses: actions/checkout@v7.0.1
        with:
          repository: RikenSugitaLab/cgback-paper
          ref: f4abbd55b92dbbed46a61943d7680e1e04009500
          path: .test-data/cgback-paper
          sparse-checkout: 02-tables/models/scn-test/pulchra
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build WebAssembly module
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check out SCN test fixtures
        uses: actions/checkout@v7.0.1
        with:
          repository: RikenSugitaLab/cgback-paper
          ref: f4abbd55b92dbbed46a61943d7680e1e04009500
          path: .test-data/cgback-paper
          sparse-checkout: 02-tables/models/scn-test/pulchra
          sparse-checkout-cone-mode: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        run: |
          node -e "const { version } = require('./package.json'); const tag = process.env.GITHUB_REF_NAME; if (tag !== version && tag !== 'v' + version) throw new Error('Release tag ' + tag + ' does not match package version ' + version)"

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build WebAssembly module
        run: npm run build

      - name: Test release build
        run: npm test

      - name: Publish package
        run: npm stage publish --access public --provenance
